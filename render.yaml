services:
  - type: web
    name: performance-prediction-system
    env: python
    region: singapore        # closest to India
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "python manage.py migrate && gunicorn myproject.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true    # Render auto-generates a secure secret key
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
